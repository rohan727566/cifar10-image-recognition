name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set PYTHONPATH
        shell: bash
        run: echo "PYTHONPATH=${{ github.workspace }}/src" >> $GITHUB_ENV
      
      - name: Verify imports work
        run: |
          python -c "import sys; print('Python:', sys.version); sys.path.insert(0, 'src'); from cifar_app import config; print('✓ Config imported successfully')"
      
      - name: Run linting with ruff (optional)
        run: |
          ruff check src/ tests/ || echo "⚠️ Ruff warnings (non-blocking)"
        continue-on-error: true
      
      - name: Run code formatting check with black (optional)
        run: |
          black --check src/ tests/ || echo "⚠️ Black formatting issues (non-blocking)"
        continue-on-error: true
      
      - name: Run tests with pytest (verbose output)
        run: |
          pytest tests/ -v --tb=short --co  # List tests first
          pytest tests/ -v --tb=short        # Run tests with detailed output
      
      - name: Upload coverage reports (if available)
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    if: success()  # Only run if tests pass
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log build success
        run: |
          echo "✓ All tests passed! Build stage approved."
          echo "Next: Deploy to Render on main branch"
