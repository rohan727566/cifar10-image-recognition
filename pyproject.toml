[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cifar10-image-recognition"
version = "1.0.0"
description = "Image Recognition System using CIFAR-10 Dataset with CNN"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Rohan Kumar"},
    {name = "Rishit"},
    {name = "Shaurya Vardhan Singh"},
    {name = "Vaishnavi Shukla"},
    {name = "Sudhanshu Awasthi"},
]
keywords = ["cifar10", "image-recognition", "cnn", "deep-learning", "tensorflow"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src/cifar_app",
    "--cov-report=html",
    "--cov-report=term-missing",
]
