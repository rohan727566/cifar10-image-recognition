name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verify Python and imports
        run: |
          python --version
          python -c "import sys; sys.path.insert(0, 'src'); from cifar_app.config import *; print('✓ Config module imports successfully')"
          python -c "import sys; sys.path.insert(0, 'src'); from cifar_app.model import build_model; print('✓ Model module imports successfully')"
      
      - name: Run linting with ruff (informational)
        run: ruff check src/ tests/
        continue-on-error: true
      
      - name: Run code formatting check with black (informational)
        run: black --check src/ tests/
        continue-on-error: true
      
      - name: List tests
        run: pytest tests/ --collect-only
      
      - name: Run pytest with verbose output
        run: |
          export PYTHONPATH=${{ github.workspace }}/src:$PYTHONPATH
          pytest tests/ -v --tb=short --co
          pytest tests/ -v --tb=short
      
      - name: Upload coverage (if available)
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log build success
        run: |
          echo "✅ All tests passed!"
          echo "Build stage approved for deployment"
