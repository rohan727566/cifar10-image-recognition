<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CIFAR-10 Classifier</title>
    <link rel="stylesheet" href="static/styles.css" />
</head>

<body>
    <div class="glass-card">
        
        <h1 class="title">🎓 CIFAR-10 Image Classifier</h1>
        <p class="subtitle">AI-powered image recognition trained on 60,000 images.</p>

        <!-- Step 1: Upload -->
        <div id="stepUpload">
            <div id="dropZone" class="dropzone">
                <p>📸 Drag & Drop Image Here<br><span>or click to browse</span></p>
                <input type="file" id="imageInput" accept="image/*" hidden />
            </div>
        </div>

        <!-- Preview (after upload) -->
        <img id="preview" hidden />

        <!-- Step 2: Start Recognition -->
        <button id="startBtn" class="start-btn" hidden>Start Recognition</button>

        <!-- Loading spinner -->
        <div id="spinner" class="loader" hidden></div>

        <!-- Step 3: Results -->
        <div id="results" hidden class="results">
            <h2>Top Predictions</h2>
            <div id="predictionsList"></div>
        </div>

    </div>

    <script src="static/app.js"></script>
</body>
</html>
